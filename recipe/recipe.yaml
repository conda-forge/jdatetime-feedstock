schema_version: 1

context:
  version: "6.0.0"

package:
  name: jdatetime
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jdatetime/jdatetime-${{ version }}.tar.gz
  sha256: c063091031ef8b64a8d0adbcc4ba3b55f1b1bde8e1fe53b9ec2110e8c9c7f571

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - jalali-core >=1.0

tests:
  - python:
      imports:
        - jdatetime
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Jalali datetime binding for python
  license: PSF-2.0
  license_file: LICENSE
  homepage: https://github.com/slashmili/python-jalali
  documentation: https://pythonhosted.org/jdatetime/

extra:
  recipe-maintainers:
    - tacaswell
    - ocefpaf
